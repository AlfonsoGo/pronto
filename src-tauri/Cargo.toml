[package]
name = "pronto"
version = "2.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arboard = "3.6.1"
base64 = "0.23.1"
chrono = "0.4.45"
cpal = "0.18.2"
crossbeam-channel = "0.5.17"
dirs = "7.0.0"
parking_lot = "0.12.5"
regex = "1.11"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
sherpa-onnx = "1.13.8"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_Com", "Win32_System_DataExchange", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Graphics_Gdi"] }

[build-dependencies]
tauri-build = "2"
