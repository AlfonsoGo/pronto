<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pronto Flow bar</title>
<link rel="stylesheet" href="flowbar.css">
</head>
<body>

<!-- Anuncia los cambios de estado a lectores de pantalla -->
<div id="live" class="sr" role="status" aria-live="polite" aria-atomic="true"></div>

<!-- La ventana de Tauri mide 360x150: el escenario es la ventana entera -->
<div id="stage" class="stage">

  <!-- Tarjeta de aviso / error (encima de la píldora) -->
  <div id="card" class="card" role="status" hidden>
    <button id="card-x" class="card-x" type="button" aria-label="Cerrar aviso">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
    <div class="card-head">
      <svg id="card-ico" class="card-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
      <div id="card-title" class="card-title"></div>
    </div>
    <div id="card-body" class="card-body"></div>
    <button id="card-act" class="card-act" type="button" hidden></button>
  </div>

  <!-- Tooltip único, se coloca encima del elemento con data-tip -->
  <div id="tip" class="tip" aria-hidden="true"></div>

  <!-- Zona de hover: píldora + satélites + margen anti-parpadeo -->
  <div id="hot" class="hot" data-s="rest">
    <div id="pill" class="pill" data-s="rest" role="button" aria-label="Dictar" data-tip="dyn">

      <div class="fill" id="fill"></div>

      <div class="row">
        <!-- ready -->
        <svg class="ico ico-mic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg>

        <!-- manos libres: cancelar -->
        <button id="btn-cancel" class="btn btn-cancel" type="button" data-tip="Cancelar" aria-label="Cancelar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>

        <!-- ondas (listening, handsfree, processing) -->
        <div id="waves" class="waves" aria-hidden="true"></div>

        <!-- manos libres: finalizar y pegar -->
        <button id="btn-stop" class="btn btn-stop" type="button" data-tip="Finalizar y pegar" aria-label="Finalizar y pegar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>
        </button>

        <!-- iconos y rótulos de estado -->
        <svg class="ico ico-spark" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/></svg>
        <svg class="ico ico-check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
        <svg class="ico ico-x" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        <svg class="ico ico-alert" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
        <span id="label" class="label"></span>

        <!-- spinner de 8 barras -->
        <div id="spinner" class="spinner" aria-hidden="true"></div>
      </div>

      <div class="shine"></div>
    </div>

    <!-- satélite: Tomar notas (solo en «ready») -->
    <button id="sat-notes" class="sat sat-notes" type="button" data-tip="Tomar notas" aria-label="Tomar notas de la reunión">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.4 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7.4"/><path d="M2 6h4"/><path d="M2 10h4"/><path d="M2 14h4"/><path d="M2 18h4"/><path d="M18.4 2.6a2.17 2.17 0 0 1 3 3L16 11l-4 1 1-4Z"/></svg>
    </button>

    <!-- satélite: Polish (solo en «ready») -->
    <button id="sat-polish" class="sat sat-polish" type="button" data-tip="Polish" aria-label="Polish: pulir el texto seleccionado">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21.64 3.64-1.28-1.28a1.21 1.21 0 0 0-1.72 0L2.36 18.64a1.21 1.21 0 0 0 0 1.72l1.28 1.28a1.2 1.2 0 0 0 1.72 0L21.64 5.36a1.2 1.2 0 0 0 0-1.72"/><path d="m14 7 3 3"/><path d="M5 6v4"/><path d="M19 14v4"/><path d="M10 2v2"/><path d="M7 8H3"/><path d="M21 16h-4"/><path d="M11 3H9"/></svg>
    </button>
  </div>

  <!-- solo depuración (modo demo): contorno del rectángulo pulsable -->
  <div id="hitdbg" class="hitdbg" hidden></div>
</div>

<script src="flowbar.js"></script>
</body>
</html>
